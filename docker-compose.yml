# WishBox Frontend - Coolify Deployment
# Unique host port: 30847 (container internal port: 80)

services:
  wishbox-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wishbox-frontend
    restart: unless-stopped
    ports:
      - "30847:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
