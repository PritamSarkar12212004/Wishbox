<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/maindp.webp" />
    <link rel="apple-touch-icon" href="/maindp.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="WishBox — handmade paper, gift wrap, lighting and home décor, made in small batches by artisan studios across India."
    />
    <link rel="canonical" href="https://www.wishboxdecor.in/" />

    <!--
      Link previews (WhatsApp, Facebook, Instagram, X, Slack).

      Crawlers do not run JavaScript and ignore relative paths, so every URL
      below is absolute with https and the image is a JPEG at 1200×630 — the
      size those clients crop to. A relative `og:image` or a WebP is the usual
      reason a shared link arrives with no card at all.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WishBox" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.wishboxdecor.in/" />
    <meta property="og:title" content="WishBox — Handmade Paper & Home Décor" />
    <meta
      property="og:description"
      content="Small-batch handmade paper, gift wrap and home décor. Shop the full collection."
    />
    <meta property="og:image" content="https://www.wishboxdecor.in/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WishBox — handmade paper and home décor" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WishBox — Handmade Paper & Home Décor" />
    <meta
      name="twitter:description"
      content="Small-batch handmade paper, gift wrap and home décor. Shop the full collection."
    />
    <meta name="twitter:image" content="https://www.wishboxdecor.in/og-cover.jpg" />

    <title>WishBox — Handmade Paper &amp; Home Décor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
